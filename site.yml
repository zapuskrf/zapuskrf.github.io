# Настройки сайта «Запуск»
name: Запуск
tagline: Новые производства, технологии и инфраструктура России
description: Ежедневная лента о новых предприятиях, технологиях и инфраструктурных объектах России. Только официальные источники.
# Адрес сайта без слеша в конце. После покупки домена поменять на https://zapuskrf.ru
url: https://zapuskrf.github.io
# Свой домен (например zapuskrf.ru). Пусто — используется адрес github.io
domain: ""
# Telegram-канал
telegram_channel: zapuskrf
language: ru
# Номер счётчика Яндекс Метрики (только цифры). Пусто — Метрика не подключается
yandex_metrika_id: ""

# Расписание выхода новостей (время московское).
# Новости одного выпуска выходят по одной, подряд с утра: order 1 — в publish_start,
# каждая следующая — через publish_interval минут. Если новостей так много, что они
# не успевают выйти до publish_end, интервал автоматически сокращается.
# Время отдельной новости можно задать в её файле: publish_at: "14:30"
timezone: Europe/Moscow
publish_start: "07:00"
publish_end: "23:00"
publish_interval: 60

rubrics:
  - name: Промышленность
    slug: promyshlennost
    emoji: "🏭"
    color: "#4a5a6a"
  - name: Технологии и изобретения
    slug: tehnologii
    emoji: "🔬"
    color: "#5d4a8a"
  - name: Инфраструктура
    slug: infrastruktura
    emoji: "🛣"
    color: "#b5651d"
  - name: Логистика
    slug: logistika
    emoji: "🚢"
    color: "#2f6f78"
  - name: IT и связь
    slug: it
    emoji: "💻"
    color: "#2b5ea7"

# Статусы событий и цвет плашки для каждого (белый текст на этом фоне)
statuses:
  - name: Введено в эксплуатацию
    color: "#1e7b4a"
  - name: Запуск производства
    color: "#d7372b"
  - name: Начало строительства
    color: "#b45309"
  - name: Патент / разработка
    color: "#6b46c1"
  - name: Официально объявленный проект
    color: "#4a5a6a"
