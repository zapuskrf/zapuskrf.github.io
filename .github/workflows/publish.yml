name: Сборка сайта и публикация в Telegram

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pyyaml jinja2
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  telegram:
    # Посты уходят в канал только после того, как сайт со статьями опубликован
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Найти новые статьи
        id: new
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          FILES=$(git diff --name-only --diff-filter=A "$BEFORE" "${{ github.sha }}" -- 'content/news/*.md' | tr '\n' ' ')
          echo "Новые статьи: $FILES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
      - name: Дождаться, пока страницы откроются
        if: steps.new.outputs.files != ''
        run: |
          FIRST=$(echo "${{ steps.new.outputs.files }}" | awk '{print $1}')
          SLUG=$(basename "$FIRST" .md)
          BASE=$(python -c "import yaml;print(yaml.safe_load(open('site.yml'))['url'].rstrip('/'))")
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "$BASE/news/$SLUG/"; then echo "Страница доступна"; exit 0; fi
            sleep 10
          done
          echo "Страница не открылась за 5 минут, публикую всё равно"
      - name: Опубликовать посты
        if: steps.new.outputs.files != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
        run: python scripts/telegram_post.py ${{ steps.new.outputs.files }}
